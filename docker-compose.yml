# Full-stack Docker deployment for QuickBite Delivery.
#
# This is for (a) a quick local sanity-check that everything containerizes
# correctly before pushing to a real host, and (b) self-hosting the whole
# backend on any VPS with Docker installed ("docker compose up -d" and
# you're done). It is NOT how local development is meant to work day to
# day - for that, use the .bat scripts / "mvn spring-boot:run" described
# in the root README, which gives faster rebuilds and real IDE debugging.
#
# Usage:
#   docker compose up -d --build     # start everything
#   docker compose logs -f order-service   # tail one service's logs
#   docker compose down              # stop everything
#   docker compose down -v           # stop and wipe the database too

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - quickbite-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: authdb
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file - see docs/DEPLOY.md}

  restaurant-service:
    build: ./restaurant-service
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: restaurantdb
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file - see docs/DEPLOY.md}
      UPLOAD_DIR: /data/uploads
    volumes:
      - quickbite-uploads:/data/uploads

  payment-service:
    build: ./payment-service
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: paymentdb
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file - see docs/DEPLOY.md}

  order-service:
    build: ./order-service
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: orderdb
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file - see docs/DEPLOY.md}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  api-gateway:
    build: ./api-gateway
    depends_on:
      - auth-service
      - restaurant-service
      - payment-service
      - order-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file - see docs/DEPLOY.md}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}

volumes:
  quickbite-pgdata:
  quickbite-uploads:
