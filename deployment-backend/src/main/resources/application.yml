server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: quickbite-deployment-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quickbite}
    username: ${DB_USER:quickbite}
    password: ${DB_PASSWORD:quickbite}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
security:
  jwt:
    secret: ${JWT_SECRET:quickbite-super-secret-signing-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always